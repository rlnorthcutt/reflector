apiVersion: v1
kind: ConfigMap
metadata:
  name: reflector-routes
  labels:
    app: reflector
data:
  api.yaml: |
    routes:
      - path: /api/status
        method: GET
        response:
          status: 200
          headers:
            Content-Type: application/json
          body: |
            {"status": "ok", "served_by": "{{ .Hostname }}", "requested_at": "{{ .Timestamp }}"}
