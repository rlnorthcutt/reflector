apiVersion: v1
kind: Service
metadata:
  name: reflector
  labels:
    app: reflector
spec:
  selector:
    app: reflector
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Deliberately ClusterIP-only and split from the traffic Service above:
# the admin API is meant to be firewalled off from regular traffic (per
# PLAN.md), never exposed via a LoadBalancer/NodePort. Reach it for demos
# with `kubectl port-forward svc/reflector-admin 8081:8081`.
apiVersion: v1
kind: Service
metadata:
  name: reflector-admin
  labels:
    app: reflector
spec:
  selector:
    app: reflector
  ports:
    - name: admin
      port: 8081
      targetPort: admin
